# Morainet 组织官网配置
title: Morainet
description: Morainet 是一个专注于实用技术的开源组织，这里汇集我们的项目与探索。
url: "https://morainet.github.io"
baseurl: ""
markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# 项目集合：在 _projects/ 放一个 .md 文件即自动生成一个项目页
collections:
  projects:
    output: true
    permalink: /projects/:name/

# 组织信息（首页与页脚共用）
org:
  name: Morainet
  tagline: 务实、开放、探索边界的技术组织
  github: "https://github.com/Morainet"
  description: >
    这里集中展示 Morainet 组织内正在推进的各类项目，涵盖人工智能、端侧智能、
    音视频生成与开发者工具等方向。
